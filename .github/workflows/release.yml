name: Release

# A tag like v0.1.0 builds every platform and publishes a GitHub pre-release with the downloads.
# Run it by hand (workflow_dispatch) to build the packages without publishing them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      test_signing:
        description: Sign the Windows builds with a throwaway certificate when no real one is set
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Developer ID signing and notarization, used when these repository secrets are set
      # (packaging/README.md says how to make them); without them the app is signed ad hoc.
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Version
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - run: rustup toolchain install && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build for Apple silicon and Intel
        run: |
          cargo build --release -p only3d --bin only3d --target aarch64-apple-darwin
          cargo build --release -p only3d --bin only3d --target x86_64-apple-darwin
          lipo -create -output only3d target/aarch64-apple-darwin/release/only3d target/x86_64-apple-darwin/release/only3d
          lipo -info only3d
          ./only3d --version
          ./only3d tools --brief > tools.txt && head -3 tools.txt
      - name: Third-party notices
        run: python3 packaging/third_party_notices.py target/THIRD-PARTY-NOTICES.txt
      - name: Signing certificate
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: packaging/macos/keychain.sh
      - name: App and disk image
        run: packaging/macos/package.sh ./only3d "$VERSION" dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  windows:
    runs-on: windows-latest
    env:
      # Authenticode signing, used when these repository secrets are set (packaging/README.md)
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      WINDOWS_TEST_SIGNING: ${{ inputs.test_signing }}
    steps:
      - uses: actions/checkout@v5
      - name: Version
        shell: bash
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p only3d
      - name: Smoke test
        shell: bash
        run: |
          ./target/release/only3d.exe --version
          ./target/release/only3d.exe tools --brief > tools.txt && head -3 tools.txt
          test -f ./target/release/only3d-app.exe
      - name: Third-party notices
        run: python packaging/third_party_notices.py target/THIRD-PARTY-NOTICES.txt
      - name: Installer and portable zip
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $v = $env:VERSION
          New-Item -ItemType Directory -Force dist | Out-Null
          ./packaging/windows/sign.ps1 target\release\only3d.exe target\release\only3d-app.exe
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V2 "/DVERSION=$v" "/DSRC=$pwd\target\release" "/DOUT=$pwd\dist\only3d-$v-windows-x64-setup.exe" packaging\windows\only3d.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./packaging/windows/sign.ps1 "dist\only3d-$v-windows-x64-setup.exe"
          Compress-Archive -Path target\release\only3d.exe, target\release\only3d-app.exe, LICENSE, target\THIRD-PARTY-NOTICES.txt -DestinationPath "dist\only3d-$v-windows-x64.zip"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    # the oldest supported Ubuntu, so the build runs on as many distributions as possible
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Version
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev libdbus-1-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p only3d --bin only3d
      - name: Smoke test
        run: |
          ./target/release/only3d --version
          ./target/release/only3d tools --brief > tools.txt && head -3 tools.txt
      - name: Packaging tools
        run: |
          cargo install cargo-deb --locked
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          (cd /tmp && ./appimagetool --appimage-extract >/dev/null)
          printf '#!/bin/sh\nexec /tmp/squashfs-root/AppRun "$@"\n' | sudo tee /usr/local/bin/appimagetool >/dev/null
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Third-party notices
        run: python3 packaging/third_party_notices.py target/THIRD-PARTY-NOTICES.txt
      - name: AppImage, .deb and .tar.gz
        run: |
          mkdir -p dist
          cargo deb -p only3d --no-build --output "dist/only3d-$VERSION-linux-amd64.deb"
          packaging/linux/package.sh target/release/only3d "$VERSION" dist
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  # ARM64 builds, cross-compiled on the x64 runners (no ARM64 machine to smoke-test them on)
  windows-arm64:
    runs-on: windows-latest
    env:
      # Authenticode signing, used when these repository secrets are set (packaging/README.md)
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      WINDOWS_TEST_SIGNING: ${{ inputs.test_signing }}
    steps:
      - uses: actions/checkout@v5
      - name: Version
        shell: bash
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - run: rustup toolchain install && rustup target add aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p only3d --target aarch64-pc-windows-msvc
      - name: Third-party notices
        run: python packaging/third_party_notices.py target/THIRD-PARTY-NOTICES.txt
      - name: Installer and portable zip
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $v = $env:VERSION
          $bin = "target\aarch64-pc-windows-msvc\release"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\THIRD-PARTY-NOTICES.txt "target\aarch64-pc-windows-msvc\THIRD-PARTY-NOTICES.txt"
          ./packaging/windows/sign.ps1 "$bin\only3d.exe" "$bin\only3d-app.exe"
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V2 "/DVERSION=$v" "/DSRC=$pwd\$bin" "/DOUT=$pwd\dist\only3d-$v-windows-arm64-setup.exe" packaging\windows\only3d.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./packaging/windows/sign.ps1 "dist\only3d-$v-windows-arm64-setup.exe"
          Compress-Archive -Path "$bin\only3d.exe", "$bin\only3d-app.exe", LICENSE, target\THIRD-PARTY-NOTICES.txt -DestinationPath "dist\only3d-$v-windows-arm64.zip"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: dist/*

  linux-arm64:
    runs-on: ubuntu-22.04
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v5
      - name: Version
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - name: Cross compiler
        # X11, Wayland and fontconfig are loaded at run time, so nothing else needs linking
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - run: rustup toolchain install && rustup target add aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p only3d --bin only3d --target aarch64-unknown-linux-gnu
      - name: Third-party notices
        run: python3 packaging/third_party_notices.py target/THIRD-PARTY-NOTICES.txt
      - name: .deb and .tar.gz
        run: |
          mkdir -p dist
          cargo install cargo-deb --locked
          cargo deb -p only3d --no-build --target aarch64-unknown-linux-gnu --output "dist/only3d-$VERSION-linux-arm64.deb"
          packaging/linux/package.sh target/aarch64-unknown-linux-gnu/release/only3d "$VERSION" dist aarch64
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux, windows-arm64, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Pre-release with the downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/__VERSION__/$version/g" packaging/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --prerelease --title "only3d $version" --notes-file notes.md
