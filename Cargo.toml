[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/onatyap/only3d"
rust-version = "1.85"

[workspace.dependencies]
only3d-geom = { path = "crates/only3d-geom" }
only3d-model = { path = "crates/only3d-model" }
only3d-slice = { path = "crates/only3d-slice" }
only3d-profiles = { path = "crates/only3d-profiles" }
only3d-bambu = { path = "crates/only3d-bambu" }
only3d-studio = { path = "crates/only3d-studio" }
only3d-gui = { path = "crates/only3d-gui" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
glam = { version = "0.32", features = ["serde"] }
rayon = "1.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
png = "0.17"
schemars = "1"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
i_overlay = "4"
boolmesh = "0.2.2"
rusqlite = { version = "0.37", features = ["bundled"] }
# canonical paths without Windows' \\?\ prefix, which other apps (and OpenSCAD) may not accept
dunce = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
